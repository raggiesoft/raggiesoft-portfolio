<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Page Not Found | Michael P. Ragsdale</title>
    <meta name="description" content="The requested page could not be found on michaelpragsdale.com." />
    <meta name="robots" content="noindex, follow" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --accent: #0369a1;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070b14;
          --surface: #0f172a;
          --text: #f8fafc;
          --muted: #cbd5e1;
          --border: #334155;
          --accent: #38bdf8;
          --accent-fg: #070b14;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 640px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      }
      .eyebrow {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        padding: 0.65rem 1.15rem;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--text);
      }
      a.btn-primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main id="content">
      <p class="eyebrow">Michael P. Ragsdale • 404 Not Found</p>
      <h1>Page Not Found</h1>
      <p>
        The address you requested does not exist on <strong>michaelpragsdale.com</strong>. Return to the main Engineering &amp; Section 508 Portfolio or visit the RaggieSoft Network Hub below.
      </p>
      <div class="actions">
        <a href="https://michaelpragsdale.com/" class="btn btn-primary">👔 Open Engineering Portfolio</a>
        <a href="https://raggiesoft.com" class="btn">🌐 RaggieSoft Network Hub</a>
      </div>
    </main>
  </body>
</html>

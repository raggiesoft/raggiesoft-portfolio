  <!-- Synchronous Theme Detection Script: Prevents FOUC by syncing <meta name="color-scheme"> before first paint -->
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var saved = localStorage.getItem('color-scheme');
        if (meta && (saved === 'light' || saved === 'dark')) {
          meta.content = saved;
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // Ignore storage errors in strict privacy browsers; CSS prefers-color-scheme handles fallback natively.
      }
    })();
  </script>

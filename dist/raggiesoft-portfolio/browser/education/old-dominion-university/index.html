READ-ALONG TEACHING OVERVIEW (100-Level JavaScript & HTML Guide):

1. What is this file, and why is Line 1 `<!doctype html>`?
   `src/index.html` is the outer HTML shell sent to the browser before any
   Angular JavaScript runs.
   - Line 1 MUST always be `<!doctype html>`: it instructs every web browser to
     use modern HTML5 and CSS "Standards Mode" instead of 1990s "Quirks Mode".

2. How does `src/index.html` fit into the build and runtime pipeline?
   - During `npm run build`, Angular's compiler injects our compiled CSS
     (`styles.css`) and compiled JavaScript (`main.ts` -> `main-<hash>.js`)
     into `dist/raggiesoft-portfolio/browser/index.html`.
   - Next, `scripts/postbuild-routes.mjs` reads that compiled `index.html` and
     clones route-specific copies for `/build-team` and `/build-team/<slug>`
     with customized page titles and social-preview metadata. (Note: Keep each
     metadata tag in `<head>` on its own single line so `postbuild-routes.mjs`
     can match and replace them cleanly!)
   - Finally, in the visitor's browser, Angular boots up and mounts our entire
     interactive portfolio inside `<mpr-root></mpr-root>` near the bottom of
     this file.

3. Architectural & Performance Highlights:
   - Zero external webfont requests: relies strictly on native OS system UI and
     monospace font stacks for sub-second Largest Contentful Paint (LCP).
   - Synchronous pre-paint theme script in `<head>` prevents any white/dark
     Flash of Unstyled Content (FOUC) when a visitor has pinned Light or Dark mode.
   - Includes Schema.org `ProfilePage` JSON-LD structured data for search
     engines and recruiter/ATS parsers.
=============================================================================
-->

    CORE DOCUMENT METADATA, VIEWPORT & CANONICAL URL:
    - `charset="utf-8"`: Supports all international characters and symbols (`•`, `✦`, `→`).

    - `<base href="/">`: Crucial for Single-Page Applications! Tells the browser
      to resolve relative asset URLs from the domain root `/` even when visiting
      nested URLs like `/build-team/paige`.
    - `viewport`: Tells mobile phones to render at true device width (`1:1` CSS
      pixels) instead of shrinking a 980px desktop page onto a tiny screen.
    - `color-scheme`: Declares native Light + Dark mode support to the browser
      before CSS even finishes loading (adapting scrollbars and form controls).

    Google Analytics 4 (GA4) Telemetry Integration (G-P9RG9JVYB6)
    =========================================================================
    Unified RaggieSoft ecosystem measurement property. Loaded asynchronously

    Paint (LCP) or Interaction to Next Paint (INP) during portfolio reviews.
    - `window.dataLayer = window.dataLayer || []` uses JavaScript's logical OR
      fallback to reuse an existing array or initialize an empty one `[]`.
    =========================================================================

  </script>

  <!--
    =========================================================================
    SYNCHRONOUS PRE-PAINT THEME DETECTION SCRIPT (PREVENTING FOUC)
    =========================================================================
    Why is this tiny `<script>` NOT marked `async` or `defer`?
    Suppose a user's operating system is set to Light Mode, but they previously
    clicked "Dark" on our site (saving `'dark'` in `localStorage`). If we waited
    until Angular finished booting to check `localStorage`, the browser would
    paint a bright white screen for a split second before snapping to dark!

    By running this 10-line Immediately Invoked Function Expression (`(function () { ... })()`)
    synchronously inside `<head>` BEFORE `<body>` paints:
    1. Wrapping in `(function () { ... })();` keeps `meta` and `saved` scoped
       privately inside the function instead of polluting `window` globals.
    2. If `'light'` or `'dark'` is stored in `localStorage`, it updates both
       `meta[name="color-scheme"]` and `<html data-theme="...">` before Frame 1!
    =========================================================================
  -->
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var saved = localStorage.getItem('color-scheme');
        if (meta && (saved === 'light' || saved === 'dark')) {
          meta.content = saved;
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // Ignore storage errors in strict privacy browsers; CSS prefers-color-scheme handles fallback natively.
      }
    })();
  </script>

    Instead of executable JavaScript code, a script tag with `type='application/ld+json'`
    holds **JSON-LD** ("JavaScript Object Notation for Linked Data")—a standardized
    machine-readable vocabulary from https://schema.org used by search engines
    and recruiting/indexing tools to understand *who* this portfolio belongs to:
      - `@type: "ProfilePage"` + `mainEntity` (`@type: "Person"`): Identifies
        Michael P. Ragsdale, job title, Norfolk, VA location, and contact email.
      - `worksFor` & `alumniOf`: Connects current organizations and Virginia
        higher-education institutions (TCC and ODU).
      - `knowsAbout`: Explicitly enumerates full-stack web frameworks, C#/.NET,
        SwiftUI, and code-level WCAG / Section 508 Web engineering skills.
      - `sameAs`: Cross-verifies all 10 companion RaggieSoft web properties plus
        GitHub and LinkedIn profiles.

    Unlike JavaScript `.js` files, strict JSON data (`{ "key": "value" }`) does
    NOT allow `//` or `/* */` comments inside the JSON block itself—putting a
    comment inside the `application/ld+json` block would make the JSON invalid!
    That is why we document it right here in HTML comments above the tag.
    =========================================================================
  -->

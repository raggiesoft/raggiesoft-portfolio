<!doctype html>
<!--
=============================================================================
File: public/404.html
Application: Michael P. Ragsdale — Engineering & Section 508 Portfolio
Domain: https://michaelpragsdale.com
License: MIT License
=============================================================================
READ-ALONG TEACHING OVERVIEW (100-Level JavaScript, HTML & CSS Guide):

1. What is this file, and why does it live inside `public/`?
   In HTTP (the protocol browsers and web servers use to talk to each other),
   status code `404` means "Not Found"—the visitor requested a URL path or
   static file that does not exist on the server.
   - Because `angular.json` configures `"assets": [{ "glob": "**/*", "input": "public" }]`,
     every file inside `public/` is copied verbatim into the root of our
     production build folder (`dist/raggiesoft-portfolio/browser/404.html`).
   - On the production Ubuntu/Nginx server (`jessica.raggiesoft.com`), Nginx
     serves this static `404.html` page whenever an invalid asset or unmapped
     path returns a 404 status.

2. Why is CSS written inline inside `<style>` instead of linking an external file?
   Error pages should be **100% self-contained** (zero external `.css`, `.js`,
   or webfont dependencies). Even if a visitor typed a deeply nested broken path
   like `/missing/folder/file.pdf` or experienced a partial network hiccup, this
   single HTML response renders an accessible, high-contrast Light/Dark recovery
   card in a single round trip!
=============================================================================
-->
<html lang="en">
  <head>
    <!-- Standard UTF-8 character encoding and responsive mobile viewport -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Declares native Light + Dark support for browser scrollbars & system UI -->
    <meta name="color-scheme" content="light dark" />
    <title>Page Not Found | Michael P. Ragsdale</title>
    <meta name="description" content="The requested page could not be found on michaelpragsdale.com." />

    <!--
      SEO Crawler Directive (`robots`):
      - `noindex`: Tells search engines (Google, Bing) NOT to list this 404 error
        page in search results.
      - `follow`: Still allows search crawlers to follow the recovery links back
        to `https://michaelpragsdale.com/` and `https://raggiesoft.com`.
    -->
    <meta name="robots" content="noindex, follow" />

    <!-- Self-contained, WCAG 2.1 AA high-contrast Light & Dark Mode stylesheet -->
    <style>
      /*
       * 1. CSS Custom Properties (Variables) on `:root` (`<html>`):
       *    Any property starting with two hyphens (like `--bg` or `--text`) is a
       *    reusable CSS variable we can read later with `var(--bg)`.
       *    By default, we define crisp Light Mode colors exceeding 4.5:1 / 7:1 contrast.
       */
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --accent: #0369a1;
        --accent-fg: #ffffff;
      }

      /*
       * 2. Automatic OS Dark Mode (`@media (prefers-color-scheme: dark)`):
       *    When the visitor's computer or phone is set to Dark Mode, the browser
       *    automatically swaps the exact same `--bg`, `--surface`, and `--text`
       *    variables to deep slate Dark Mode colors—with zero JavaScript needed!
       */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070b14;
          --surface: #0f172a;
          --text: #f8fafc;
          --muted: #cbd5e1;
          --border: #334155;
          --accent: #38bdf8;
          --accent-fg: #070b14;
        }
      }

      /*
       * 3. Full-Viewport Flexbox Centering on `<body>`:
       *    `min-height: 100vh` (100% of the viewport height) combined with
       *    `display: flex; align-items: center; justify-content: center;`
       *    centers the `<main>` card both vertically and horizontally on any screen.
       */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Elevated surface card holding the 404 message and recovery links */
      main {
        max-width: 640px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      }

      /* Small uppercase status label above the main `<h1>` heading */
      .eyebrow {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: var(--muted);
      }

      /* Wrapping flex row so action buttons sit side-by-side on desktop and stack cleanly on mobile */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      /* Styled `<a>` hyperlinks that look like tactile buttons while preserving native link behavior */
      a.btn {
        display: inline-flex;
        align-items: center;
        padding: 0.65rem 1.15rem;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--text);
      }
      a.btn-primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <!--
      Semantic `<main>` Landmark:
      Screen readers allow users to jump directly to `<main>`, and `<h1>` clearly
      announces "Page Not Found" followed by two one-click recovery destinations.
    -->
    <main id="content">
      <p class="eyebrow">Michael P. Ragsdale • 404 Not Found</p>
      <h1>Page Not Found</h1>
      <p>
        The address you requested does not exist on <strong>michaelpragsdale.com</strong>. Return to the main Engineering &amp; Section 508 Portfolio or visit the RaggieSoft Network Hub below.
      </p>
      <div class="actions">
        <a href="https://michaelpragsdale.com/" class="btn btn-primary">👔 Open Engineering Portfolio</a>
        <a href="https://raggiesoft.com" class="btn">🌐 RaggieSoft Network Hub</a>
      </div>
    </main>
  </body>
</html>
